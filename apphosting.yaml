# Firebase App Hosting Production Configuration
# Optimized for Next.js 15 Standalone Output

runtime: nodejs20

# Explicitly define build settings to ensure standalone output is recognized
scripts:
  buildCommand: npm run build
  runCommand: node .next/standalone/server.js

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Environment variables mapping
# Ensure these are also set in the Firebase Console -> App Hosting -> Settings
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    availability: [BUILD, RUNTIME]
  - variable: GOOGLE_API_KEY
    availability: [RUNTIME]
  - variable: NODE_ENV
    value: production
